name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/dream-portal-hardening

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 20.20.2
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm

      - name: Regenerate lockfile and install dependencies
        run: npm install

      - name: Commit regenerated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/dream-portal-hardening'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update npm lockfile [skip netlify]"
          git push

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Route and security smoke test
        run: npm run smoke:routes
