name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 20.20.2
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm

      - name: Regenerate lockfile and install dependencies
        run: npm install

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: regenerated-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Route and security smoke test
        run: npm run smoke:routes
