name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 20.20.2
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.2
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: OAuth callback response regression check
        run: node scripts/check-oauth-callback-response.mjs

      - name: Diagnosis support CTA regression check
        run: node scripts/check-diagnosis-support-link.mjs

      - name: TCW Connect safeguarding regression check
        run: node scripts/check-connect-safeguards.mjs

      - name: Route and security smoke test
        run: npm run smoke:routes
