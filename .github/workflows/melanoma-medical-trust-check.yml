name: Melanoma medical trust check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out melanoma branch
        uses: actions/checkout@v4
        with:
          ref: seo/melanoma-medical-trust
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm

      - name: Verify isolated scope
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/melanoma-medical-trust-check.yml|app/\[locale\]/sobre-cancer/\[id\]/CancerDetailPageClient.tsx|lib/melanoma-guide-trust.ts)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Verify existing trust file is unchanged
        run: git diff --exit-code origin/main -- lib/cancer-guide-trust.ts

      - name: Verify melanoma sources and figures
        run: |
          grep -F "value: '330K'" lib/melanoma-guide-trust.ts
          grep -F "value: 'Almost 60K'" lib/melanoma-guide-trust.ts
          grep -F '94.7% five-year relative survival' lib/melanoma-guide-trust.ts
          grep -F 'https://www.iarc.who.int/cancer-type/skin-cancer/' lib/melanoma-guide-trust.ts
          grep -F 'https://www.cancer.gov/types/skin/patient/melanoma-treatment-pdq' lib/melanoma-guide-trust.ts
          grep -F 'https://www.cancer.gov/espanol/tipos/piel/paciente/tratamiento-melanoma-pdq' lib/melanoma-guide-trust.ts
          grep -F 'https://seer.cancer.gov/statfacts/html/melan.html' lib/melanoma-guide-trust.ts
          ! grep -Ei 'medically reviewed|medical reviewer|lastReviewed' lib/melanoma-guide-trust.ts

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          npm run start > /tmp/tcw-melanoma-start.log 2>&1 &
          echo $! > /tmp/tcw-melanoma-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/en/about-cancer/skin > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tcw-melanoma-start.log
          exit 1

      - name: Fetch representative guide pages
        run: |
          mkdir -p .medical-test
          curl --fail --silent --show-error http://127.0.0.1:3000/en/about-cancer/skin > .medical-test/en-skin.html
          curl --fail --silent --show-error http://127.0.0.1:3000/ro/despre-cancer/piele > .medical-test/ro-skin.html
          curl --fail --silent --show-error http://127.0.0.1:3000/es/sobre-cancer/piel > .medical-test/es-skin.html
          curl --fail --silent --show-error http://127.0.0.1:3000/en/about-cancer/breast > .medical-test/en-breast.html
          curl --fail --silent --show-error http://127.0.0.1:3000/en/about-cancer/kidney > .medical-test/en-kidney.html

      - name: Validate English melanoma guide
        run: |
          grep -F 'Sources and medical information' .medical-test/en-skin.html
          grep -F '330K' .medical-test/en-skin.html
          grep -F 'Almost 60K' .medical-test/en-skin.html
          grep -F '94.7% five-year relative survival' .medical-test/en-skin.html
          grep -F 'Melanoma does not always follow the ABCDE pattern' .medical-test/en-skin.html
          grep -F 'https://www.iarc.who.int/cancer-type/skin-cancer/' .medical-test/en-skin.html

      - name: Validate Romanian melanoma guide
        run: |
          grep -F 'Surse și informații medicale' .medical-test/ro-skin.html
          grep -F '330 mii' .medical-test/ro-skin.html
          grep -F 'Aproape 60 mii' .medical-test/ro-skin.html
          grep -F '94,7%' .medical-test/ro-skin.html
          grep -F 'Melanomul nu respectă întotdeauna regula ABCDE' .medical-test/ro-skin.html

      - name: Validate Spanish melanoma guide
        run: |
          grep -F 'Fuentes e información médica' .medical-test/es-skin.html
          grep -F '330 mil' .medical-test/es-skin.html
          grep -F 'Casi 60 mil' .medical-test/es-skin.html
          grep -F '94,7%' .medical-test/es-skin.html
          grep -F 'El melanoma no siempre sigue la regla ABCDE' .medical-test/es-skin.html
          grep -F 'https://www.cancer.gov/espanol/tipos/piel/paciente/tratamiento-melanoma-pdq' .medical-test/es-skin.html

      - name: Verify existing and unrelated guides
        run: |
          grep -F 'Women diagnosed globally in 2024' .medical-test/en-breast.html
          if grep -F 'Sources and medical information' .medical-test/en-kidney.html; then
            echo 'Kidney guide unexpectedly received a trust block'
            exit 1
          fi

      - name: Stop production server
        if: always()
        run: |
          if [ -f /tmp/tcw-melanoma-server.pid ]; then
            kill "$(cat /tmp/tcw-melanoma-server.pid)" 2>/dev/null || true
          fi
