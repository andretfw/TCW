name: Homepage SEO check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SEO branch
        uses: actions/checkout@v4
        with:
          ref: seo/homepage-metadata
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm

      - name: Verify isolated scope
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/seo-homepage-check.yml|app/\[locale\]/HomePageClient.tsx|app/\[locale\]/page.tsx)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Fetch generated homepages
        run: |
          mkdir -p .seo-test
          npm run start > /tmp/tcw-seo-start.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/es > .seo-test/es.html; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/en > .seo-test/en.html
          curl --fail --silent --show-error http://127.0.0.1:3000/ro > .seo-test/ro.html
          curl --fail --silent --show-error http://127.0.0.1:3000/es > .seo-test/es.html

      - name: Validate canonical URLs
        run: |
          grep -F 'rel="canonical" href="https://tutticancerwarriors.org/en"' .seo-test/en.html
          grep -F 'rel="canonical" href="https://tutticancerwarriors.org/ro"' .seo-test/ro.html
          grep -F 'rel="canonical" href="https://tutticancerwarriors.org/es"' .seo-test/es.html

      - name: Validate hreflang alternates
        run: |
          grep -F 'hreflang="en"' .seo-test/en.html
          grep -F 'hreflang="ro"' .seo-test/en.html
          grep -F 'hreflang="es"' .seo-test/en.html
          grep -F 'hreflang="x-default"' .seo-test/en.html

      - name: Validate Open Graph locales
        run: |
          grep -F 'property="og:locale" content="en_US"' .seo-test/en.html
          grep -F 'property="og:locale" content="ro_RO"' .seo-test/ro.html
          grep -F 'property="og:locale" content="es_ES"' .seo-test/es.html

      - name: Validate localized titles
        run: |
          grep -F 'Cancer Support, Hope and Dream Grants' .seo-test/en.html
          grep -F 'Sprijin oncologic, speranță și dorințe împlinite' .seo-test/ro.html
          grep -F 'Apoyo contra el cáncer, esperanza y sueños' .seo-test/es.html

      - name: Validate organisation schema
        run: |
          grep -F '"@type":"NGO"' .seo-test/en.html
          grep -F '"@type":"WebSite"' .seo-test/en.html
          grep -F '"taxID":"50156252"' .seo-test/en.html
          grep -F '"@type":"DonateAction"' .seo-test/en.html
