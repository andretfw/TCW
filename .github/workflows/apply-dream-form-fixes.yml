name: Apply Dream form fixes

on:
  push:
    branches:
      - fix/dream-form-validation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dream-form-validation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply source changes
        run: node scripts/apply-dream-form-fixes.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve Dream application validation and documents"
          git push origin HEAD:fix/dream-form-validation
