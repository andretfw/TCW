name: Warriors page SEO check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Warriors SEO branch
        uses: actions/checkout@v4
        with:
          ref: seo/warriors-page-metadata
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm

      - name: Verify isolated scope
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/seo-warriors-check.yml|app/\[locale\]/warriors/WarriorsPageClient.tsx|app/\[locale\]/warriors/page.tsx)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Verify Warriors UI is unchanged
        run: |
          git show origin/main:'app/[locale]/warriors/page.tsx' | tr -d '[:space:]' > /tmp/expected-warriors-client.tsx
          tr -d '[:space:]' < 'app/[locale]/warriors/WarriorsPageClient.tsx' > /tmp/actual-warriors-client.tsx
          cmp /tmp/expected-warriors-client.tsx /tmp/actual-warriors-client.tsx

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Fetch generated Warriors pages
        run: |
          mkdir -p .seo-test
          npm run start > /tmp/tcw-warriors-seo-start.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/es/guerreros > .seo-test/es.html; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/en/warriors > .seo-test/en.html
          curl --fail --silent --show-error http://127.0.0.1:3000/ro/luptatori > .seo-test/ro.html
          curl --fail --silent --show-error http://127.0.0.1:3000/es/guerreros > .seo-test/es.html

      - name: Validate canonical URLs
        run: |
          grep -F 'rel="canonical" href="https://tutticancerwarriors.org/en/warriors"' .seo-test/en.html
          grep -F 'rel="canonical" href="https://tutticancerwarriors.org/ro/luptatori"' .seo-test/ro.html
          grep -F 'rel="canonical" href="https://tutticancerwarriors.org/es/guerreros"' .seo-test/es.html

      - name: Validate hreflang alternates
        run: |
          grep -Fi 'hreflang="en"' .seo-test/en.html
          grep -Fi 'hreflang="ro"' .seo-test/en.html
          grep -Fi 'hreflang="es"' .seo-test/en.html
          grep -Fi 'hreflang="x-default"' .seo-test/en.html

      - name: Validate Open Graph locales
        run: |
          grep -F 'property="og:locale" content="en_US"' .seo-test/en.html
          grep -F 'property="og:locale" content="ro_RO"' .seo-test/ro.html
          grep -F 'property="og:locale" content="es_ES"' .seo-test/es.html

      - name: Validate localized titles
        run: |
          grep -F 'Cancer Warrior Stories and Fulfilled Dreams' .seo-test/en.html
          grep -F 'Povești ale persoanelor afectate de cancer și dorințe împlinite' .seo-test/ro.html
          grep -F 'Historias de personas con cáncer y sueños cumplidos' .seo-test/es.html

      - name: Validate collection schema
        run: |
          grep -F '"@type":"CollectionPage"' .seo-test/en.html
          grep -F '"@type":"ItemList"' .seo-test/en.html
          grep -F '"numberOfItems":10' .seo-test/en.html
          grep -F '"@type":"CreativeWork"' .seo-test/en.html
          grep -F 'https://tutticancerwarriors.org/en/warriors#stories' .seo-test/en.html
