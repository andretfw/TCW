name: Sitemap accuracy check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sitemap branch
        uses: actions/checkout@v4
        with:
          ref: seo/sitemap-accuracy
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm

      - name: Verify isolated scope
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/seo-sitemap-check.yml|app/sitemap.ts)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Fetch generated sitemap
        run: |
          mkdir -p .seo-test
          npm run start > /tmp/tcw-sitemap-start.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/sitemap.xml > .seo-test/sitemap.xml; then
              break
            fi
            sleep 1
          done

          test -s .seo-test/sitemap.xml

      - name: Validate sitemap structure and coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          sitemap_path = Path('.seo-test/sitemap.xml')
          root = ET.fromstring(sitemap_path.read_text(encoding='utf-8'))
          ns = {
              'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9',
              'xhtml': 'http://www.w3.org/1999/xhtml',
          }

          entries = root.findall('sm:url', ns)
          assert len(entries) == 177, f'Expected 177 URL entries, found {len(entries)}'

          locations = []
          for entry in entries:
              loc = entry.find('sm:loc', ns)
              assert loc is not None and loc.text, 'Every sitemap entry must have a location'
              locations.append(loc.text)

              assert entry.find('sm:lastmod', ns) is None, f'Unexpected lastmod for {loc.text}'
              assert entry.find('sm:changefreq', ns) is None, f'Unexpected changefreq for {loc.text}'
              assert entry.find('sm:priority', ns) is None, f'Unexpected priority for {loc.text}'

              alternates = {
                  link.attrib.get('hreflang'): link.attrib.get('href')
                  for link in entry.findall('xhtml:link', ns)
                  if link.attrib.get('rel') == 'alternate'
              }
              assert set(alternates) == {'en', 'ro', 'es', 'x-default'}, (
                  f'Incorrect alternates for {loc.text}: {alternates}'
              )

          assert len(set(locations)) == len(locations), 'Sitemap contains duplicate locations'

          required_locations = {
              'https://tutticancerwarriors.org/en',
              'https://tutticancerwarriors.org/ro',
              'https://tutticancerwarriors.org/es',
              'https://tutticancerwarriors.org/en/donate',
              'https://tutticancerwarriors.org/ro/doneaza',
              'https://tutticancerwarriors.org/es/donar',
              'https://tutticancerwarriors.org/en/about-cancer/breast',
              'https://tutticancerwarriors.org/ro/despre-cancer/san',
              'https://tutticancerwarriors.org/es/sobre-cancer/mama',
          }
          missing = required_locations.difference(locations)
          assert not missing, f'Missing required sitemap locations: {sorted(missing)}'
          PY
