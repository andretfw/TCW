name: Audit filtered image hosts

on:
  push:
    branches:
      - upgrade/next15-maintenance

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: upgrade/next15-maintenance

      - name: Scan likely image URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          import re

          allowed = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.json'}
          keywords = ('image', 'src=', 'contentimage', 'photo', 'avatar', 'poster', 'logo')
          rows = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix not in allowed:
                  continue
              if path.name == 'package-lock.json' or any(part in {'.git', 'node_modules', '.next'} for part in path.parts):
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError:
                  continue
              for lineno, line in enumerate(lines, 1):
                  low = line.lower()
                  if not any(k in low for k in keywords):
                      continue
                  for match in re.findall(r'https://[^\s\"\'<>`)]+', line):
                      host = urlparse(match).hostname
                      if host:
                          rows.append((host, str(path), lineno, line.strip()))

          with open('image-host-audit-filtered.txt', 'w', encoding='utf-8') as out:
              for host, path, lineno, line in sorted(set(rows)):
                  out.write(f'{host}\t{path}:{lineno}\t{line}\n')
          PY

      - name: Commit filtered audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image-host-audit-filtered.txt
          git commit -m "Record filtered image host audit [skip ci]"
          git push origin HEAD:upgrade/next15-maintenance
