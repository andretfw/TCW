name: Patch PR 102 lint

on:
  push:
    branches:
      - fix/crypto-campaign-attribution

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/crypto-campaign-attribution
      - name: Remove unnecessary lock hydration effect
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/[locale]/support-dream/page.tsx')
          source = path.read_text(encoding='utf-8')
          block = """  useEffect(() => {
            setLockedDonation(readCryptoDonationLock());
          }, []);

          """
          if block not in source:
              print('Effect already removed.')
          else:
              path.write_text(source.replace(block, '', 1), encoding='utf-8')
          PY
      - name: Commit source fix when needed
        run: |
          if git diff --quiet -- 'app/[locale]/support-dream/page.tsx'; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/[locale]/support-dream/page.tsx'
          git commit -m "Remove unnecessary crypto lock effect [skip netlify]"
          git push origin HEAD:fix/crypto-campaign-attribution
