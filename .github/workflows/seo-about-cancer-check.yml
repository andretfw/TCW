name: About Cancer hub SEO check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out About Cancer SEO branch
        uses: actions/checkout@v4
        with:
          ref: seo/about-cancer-hub-metadata
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm

      - name: Verify isolated scope
        run: |
          git fetch origin main
          changed="$(git diff --name-only origin/main...HEAD | sort)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(.github/workflows/seo-about-cancer-check.yml|app/\[locale\]/sobre-cancer/AboutCancerPageClient.tsx|app/\[locale\]/sobre-cancer/page.tsx)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Verify About Cancer UI is unchanged
        run: |
          git show origin/main:'app/[locale]/sobre-cancer/page.tsx' \
            | sed 's/export default function CancerTypesPage/export default function AboutCancerPageClient/' \
            | tr -d '[:space:]' > /tmp/expected-about-cancer-client.tsx
          tr -d '[:space:]' < 'app/[locale]/sobre-cancer/AboutCancerPageClient.tsx' > /tmp/actual-about-cancer-client.tsx
          cmp /tmp/expected-about-cancer-client.tsx /tmp/actual-about-cancer-client.tsx

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Fetch generated About Cancer pages
        run: |
          mkdir -p .seo-test
          npm run start > /tmp/tcw-about-cancer-seo-start.log 2>&1 &
          server_pid=$!
          cleanup() { kill "$server_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/es/sobre-cancer > .seo-test/es.html; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://127.0.0.1:3000/en/about-cancer > .seo-test/en.html
          curl --fail --silent --show-error http://127.0.0.1:3000/ro/despre-cancer > .seo-test/ro.html
          curl --fail --silent --show-error http://127.0.0.1:3000/es/sobre-cancer > .seo-test/es.html

      - name: Validate canonical URLs
        run: |
          grep -F 'rel="canonical" href="https://tutticancerwarriors.org/en/about-cancer"' .seo-test/en.html
          grep -F 'rel="canonical" href="https://tutticancerwarriors.org/ro/despre-cancer"' .seo-test/ro.html
          grep -F 'rel="canonical" href="https://tutticancerwarriors.org/es/sobre-cancer"' .seo-test/es.html

      - name: Validate hreflang alternates
        run: |
          grep -Fi 'hreflang="en"' .seo-test/en.html
          grep -Fi 'hreflang="ro"' .seo-test/en.html
          grep -Fi 'hreflang="es"' .seo-test/en.html
          grep -Fi 'hreflang="x-default"' .seo-test/en.html

      - name: Validate Open Graph locales
        run: |
          grep -F 'property="og:locale" content="en_US"' .seo-test/en.html
          grep -F 'property="og:locale" content="ro_RO"' .seo-test/ro.html
          grep -F 'property="og:locale" content="es_ES"' .seo-test/es.html

      - name: Validate localised titles
        run: |
          grep -F 'Cancer Types and Information Guides' .seo-test/en.html
          grep -F 'Tipuri de cancer și ghiduri informative' .seo-test/ro.html
          grep -F 'Tipos de cáncer y guías informativas' .seo-test/es.html

      - name: Validate medical library schema
        run: |
          grep -F '"CollectionPage"' .seo-test/en.html
          grep -F '"MedicalWebPage"' .seo-test/en.html
          grep -F '"@type":"ItemList"' .seo-test/en.html
          grep -F '"numberOfItems":35' .seo-test/en.html
          grep -F 'https://tutticancerwarriors.org/en/about-cancer/breast' .seo-test/en.html
          grep -F 'https://tutticancerwarriors.org/ro/despre-cancer/san' .seo-test/ro.html
          grep -F 'https://tutticancerwarriors.org/es/sobre-cancer/mama' .seo-test/es.html
