name: Fix cancer trust statsTitle type

on:
  push:
    branches:
      - fix/cancer-trust-stats-title-type
    paths:
      - .github/workflows/fix-stats-title-type.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cancer-trust-stats-title-type
          fetch-depth: 0

      - name: Add optional statsTitle to trust content type
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/cancer-guide-trust.ts')
          text = path.read_text(encoding='utf-8')
          old = "  checkedDate: string;\n  stats: ["
          new = "  checkedDate: string;\n  statsTitle?: string;\n  stats: ["
          if old not in text:
              raise SystemExit('Expected CancerGuideTrustContent type block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-stats-title-type.yml
          git add lib/cancer-guide-trust.ts .github/workflows/fix-stats-title-type.yml
          git commit -m "[skip netlify] Fix cancer trust statsTitle type"
          git push origin HEAD:fix/cancer-trust-stats-title-type
