name: Fetch dedicated cancer guide images

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fetch-images:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dedicated-images-new-cancer-guides
          fetch-depth: 0

      - name: Download licensed medical images
        shell: python
        run: |
          import pathlib
          import urllib.parse
          import urllib.request

          output = pathlib.Path('public/images/cancer-guides')
          output.mkdir(parents=True, exist_ok=True)

          files = {
              'Diagram of the lung showing pleural mesothelioma CRUK 458.svg': 'mesothelioma-anatomy.svg',
              'Diagram showing the parts of the body neuroendocrine tumours most commonly develop in CRUK 463.svg': 'neuroendocrine-anatomy.svg',
              'Gastrointestinal Stromal Tumor (GIST) of Stomach.jpg': 'gist-pathology.jpg',
              'Appendix locations.svg': 'appendix-anatomy.svg',
              'Diagram showing where the adrenal glands are in the body CRUK 415.svg': 'adrenal-anatomy.svg',
              'Peritoneum.svg': 'peritoneum-anatomy.svg',
              'Fallopian tube.jpg': 'fallopian-tube-anatomy.jpg',
              'Diagram showing a primary and secondary cancer CRUK 074.svg': 'unknown-primary-anatomy.svg',
              'Schematic representation of a human placenta during the first trimester of pregnancy.jpg': 'gestational-trophoblastic-anatomy.jpg',
              'Myelodysplasia.jpg': 'mds-pathology.jpg',
              'Myelogram of person with a myeloproliferative disorder.png': 'mpn-pathology.png',
              'Neuroblastoma (1).jpg': 'neuroblastoma-pathology.jpg',
              'Male and female urethra.svg': 'urethra-anatomy.svg',
              'Renal pelves and calices.png': 'renal-pelvis-ureter-anatomy.png',
              'Diagram showing the position of the salivary glands CRUK 451.svg': 'salivary-glands-anatomy.svg',
              'Diagram showing the position of the nasal cavity 2014 CRUK 354.svg': 'nasal-sinus-anatomy.svg',
              'Diagram of the larynx CRUK 039.svg': 'larynx-dedicated-anatomy.svg',
              'Diagram showing the position of the thyroid and parathyroid glands CRUK 414.svg': 'parathyroid-anatomy.svg',
          }

          headers = {'User-Agent': 'TuttiCancerWarriors/1.0 (website medical image curation)'}
          for source_name, destination in files.items():
              encoded = urllib.parse.quote(source_name, safe='')
              url = f'https://commons.wikimedia.org/wiki/Special:Redirect/file/{encoded}'
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read()
                  content_type = response.headers.get_content_type()
              if len(data) < 1000:
                  raise RuntimeError(f'{source_name}: downloaded file is unexpectedly small ({len(data)} bytes)')
              suffix = pathlib.Path(destination).suffix.lower()
              if suffix == '.svg' and b'<svg' not in data[:5000]:
                  raise RuntimeError(f'{source_name}: expected SVG but received {content_type}')
              if suffix in {'.jpg', '.jpeg'} and not data.startswith(b'\xff\xd8'):
                  raise RuntimeError(f'{source_name}: expected JPEG but received {content_type}')
              if suffix == '.png' and not data.startswith(b'\x89PNG'):
                  raise RuntimeError(f'{source_name}: expected PNG but received {content_type}')
              (output / destination).write_bytes(data)
              print(f'{destination}: {len(data):,} bytes ({content_type})')

      - name: Commit local image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/cancer-guides
          if git diff --cached --quiet; then
            echo "Dedicated images already exist; nothing to commit."
            exit 0
          fi
          git commit -m "[skip netlify] Add dedicated images for new cancer guides"
          git push origin HEAD:fix/dedicated-images-new-cancer-guides
