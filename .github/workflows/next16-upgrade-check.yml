name: Next 16 upgrade check

on:
  push:
    branches:
      - upgrade/next15-maintenance

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/next15-maintenance

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: npm

      - name: Regenerate package lock
        id: lock
        continue-on-error: true
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm ci

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck > typecheck.log 2>&1

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint > lint.log 2>&1

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build > build.log 2>&1

      - name: Save validation report and lockfile
        run: |
          mkdir -p upgrade-results
          {
            echo "NEXT16_UPGRADE_VALIDATION"
            echo "lock_status=${{ steps.lock.outcome }}"
            echo "install_status=${{ steps.install.outcome }}"
            echo "typecheck_status=${{ steps.typecheck.outcome }}"
            echo "lint_status=${{ steps.lint.outcome }}"
            echo "build_status=${{ steps.build.outcome }}"
            echo
            echo "=== TYPECHECK ==="
            tail -400 typecheck.log 2>/dev/null || true
            echo
            echo "=== LINT ==="
            tail -400 lint.log 2>/dev/null || true
            echo
            echo "=== BUILD ==="
            tail -400 build.log 2>/dev/null || true
          } > upgrade-results/next16-validation.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json upgrade-results/next16-validation.txt
          if git diff --cached --quiet; then
            echo "No validation changes to commit"
          else
            git commit -m "Record Next.js 16 validation results [skip ci]"
            git push origin HEAD:upgrade/next15-maintenance
          fi
