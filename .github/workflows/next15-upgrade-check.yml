name: Next 15 upgrade check

on:
  push:
    branches:
      - upgrade/next15-maintenance

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4
        with:
          ref: upgrade/next15-maintenance

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run validation and save report
        shell: bash
        run: |
          set +e

          npm install --package-lock-only --ignore-scripts > lock.log 2>&1
          LOCK_STATUS=$?

          npm ci > install.log 2>&1
          INSTALL_STATUS=$?

          if [ "$INSTALL_STATUS" -eq 0 ]; then
            npm run typecheck > typecheck.log 2>&1
            TYPECHECK_STATUS=$?

            npm run lint > lint.log 2>&1
            LINT_STATUS=$?

            npm run build > build.log 2>&1
            BUILD_STATUS=$?
          else
            TYPECHECK_STATUS=99
            LINT_STATUS=99
            BUILD_STATUS=99
            echo "Skipped because npm ci failed." > typecheck.log
            echo "Skipped because npm ci failed." > lint.log
            echo "Skipped because npm ci failed." > build.log
          fi

          {
            echo "NEXT15_UPGRADE_VALIDATION"
            echo "lock_status=$LOCK_STATUS"
            echo "install_status=$INSTALL_STATUS"
            echo "typecheck_status=$TYPECHECK_STATUS"
            echo "lint_status=$LINT_STATUS"
            echo "build_status=$BUILD_STATUS"
            echo
            echo "=== TYPECHECK (last 400 lines) ==="
            tail -n 400 typecheck.log
            echo
            echo "=== LINT (last 400 lines) ==="
            tail -n 400 lint.log
            echo
            echo "=== BUILD (last 400 lines) ==="
            tail -n 400 build.log
          } > upgrade-results.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json upgrade-results.txt
          git commit -m "Record Next.js 15 validation results [skip ci]" || true
          git push origin HEAD:upgrade/next15-maintenance

          exit 0
