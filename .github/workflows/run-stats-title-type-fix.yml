name: Run statsTitle type fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-stats-title-type-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cancer-trust-stats-title-type
          fetch-depth: 0

      - name: Add optional statsTitle to CancerGuideTrustContent
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/cancer-guide-trust.ts')
          text = path.read_text(encoding='utf-8')
          old = "  checkedDate: string;\n  stats: ["
          new = "  checkedDate: string;\n  statsTitle?: string;\n  stats: ["
          if new not in text:
              if old not in text:
                  raise SystemExit('Expected CancerGuideTrustContent type block not found')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

      - name: Verify production build
        run: |
          npm ci
          npm run build

      - name: Commit verified fix to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/cancer-guide-trust.ts
          git commit -m "[skip netlify] Fix cancer trust statsTitle type"
          git push origin HEAD:fix/cancer-trust-stats-title-type
