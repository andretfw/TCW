name: Curate new cancer guide images from PR

on:
  pull_request_target:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  curate:
    if: github.event.pull_request.number == 47
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/dedicated-images-new-cancer-guides
          path: work
          fetch-depth: 0

      - name: Check out trusted curation script
        uses: actions/checkout@v4
        with:
          ref: main
          path: automation
          sparse-checkout: .github/scripts/curate_new_cancer_images.py

      - name: Curate images and update registry
        run: |
          python -m pip install --disable-pip-version-check pillow cairosvg
          cd work
          python ../automation/.github/scripts/curate_new_cancer_images.py

      - name: Verify application
        working-directory: work
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build

      - name: Commit to PR branch
        working-directory: work
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/cancer-guides lib/cancer-images.ts docs/cancer-guide-image-sources.md .github/workflows/fetch-dedicated-cancer-images.yml docs/image-fetch-trigger.txt
          git commit -m "[skip netlify] Add dedicated licensed cancer guide images"
          git push origin HEAD:fix/dedicated-images-new-cancer-guides
