<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <title>TCW Dream application server alert</title>
  </head>
  <body hidden>
    <form
      name="dream-application-server-alert"
      method="POST"
      data-netlify="true"
      netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="dream-application-server-alert">
      <input type="text" name="bot-field">
      <input type="text" name="application-reference">
      <input type="text" name="application-locale">
      <input type="text" name="submitted-at">
      <button type="submit">Send alert</button>
    </form>
  </body>
</html>
